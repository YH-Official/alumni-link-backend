# Portable MariaDB bundled with the alumni-link portable backend.
# basedir / datadir / port are NOT set here: F:\XYL-Backend\start.cmd passes them
# on the command line, resolved from the folder this script lives in, so the whole
# bundle can be copied to another drive or machine without editing anything.
# To start it by hand, use start.cmd / stop.cmd in the bundle root.

[client]
port = 3307
default-character-set = utf8mb4

[mysqld]
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci
max_connections = 200
innodb_buffer_pool_size = 256M
sql_mode = "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
