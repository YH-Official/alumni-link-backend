# Portable MariaDB used by the alumni-link (F:\XYL) backend.
# Start with:  F:\mariadb\bin\mariadbd.exe --defaults-file=F:\mariadb-data\my.ini
# Data lives outside the program directory so upgrades never touch it.

[client]
port = 3306
default-character-set = utf8mb4
plugin-dir = F:/mariadb/lib/plugin

[mysqld]
basedir = F:/mariadb
datadir = F:/mariadb-data/data
plugin-dir = F:/mariadb/lib/plugin
port = 3306
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci
max_connections = 200
innodb_buffer_pool_size = 256M
sql_mode = "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
