datasource:
  db:
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123456}"
    driver: "org.mariadb.jdbc.Driver"
    url: "${DB_URL:jdbc:mariadb://localhost:3307/alumin-link?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8}"

ebean:
  ddl:
    generate: false
    run: false

server:
  # HTTP 端口用 7031；数据库仍独占 3307，与 F:\XYL（3306）区分开
  port: 7031
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,image/png,image/jpeg
    min-response-size: 2048

spring:
  devtools:
    restart:
      enabled: false
  jackson:
    time-zone: GMT+8
  application:
    name: "alumni-link"

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%-5p}) %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
  level:
    root: INFO
  config: "classpath:logback-spring.xml"

management:
  health:
    mail:
      enabled: false
